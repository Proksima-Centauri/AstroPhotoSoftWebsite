<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Astro AI Plus Icon</title>
  <desc id="desc">Stylized AI emblem on a cosmic circuit background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2045"/>
      <stop offset="60%" stop-color="#182d67"/>
      <stop offset="100%" stop-color="#0a1331"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="30%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#81f3ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#81f3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="76%" cy="72%" r="58%">
      <stop offset="0%" stop-color="#9fa7ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9fa7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef5ff"/>
      <stop offset="60%" stop-color="#b7c5d9"/>
      <stop offset="100%" stop-color="#8ca0ba"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93f7ff"/>
      <stop offset="100%" stop-color="#59d9ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="74" fill="url(#bg)"/>
  <rect width="512" height="512" rx="74" fill="url(#nebulaA)"/>
  <rect width="512" height="512" rx="74" fill="url(#nebulaB)"/>

  <g stroke="url(#stroke)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" filter="url(#glow)">
    <path d="M44 142h120l62 62h78l46-46h116"/>
    <path d="M44 210h96l84 84h68l76-76h98"/>
    <path d="M44 302h118l58-58h92l64 64h90"/>
    <path d="M44 372h90l90-90h70l72 72h100"/>
    <circle cx="44" cy="142" r="8" fill="#89f7ff"/>
    <circle cx="466" cy="142" r="8" fill="#89f7ff"/>
    <circle cx="44" cy="210" r="8" fill="#89f7ff"/>
    <circle cx="466" cy="210" r="8" fill="#89f7ff"/>
    <circle cx="44" cy="302" r="8" fill="#89f7ff"/>
    <circle cx="466" cy="302" r="8" fill="#89f7ff"/>
    <circle cx="44" cy="372" r="8" fill="#89f7ff"/>
    <circle cx="466" cy="372" r="8" fill="#89f7ff"/>
  </g>

  <rect x="146" y="146" width="220" height="220" rx="34" fill="#2c4767" opacity="0.85"/>
  <rect x="156" y="156" width="200" height="200" rx="28" fill="url(#chip)"/>
  <rect x="166" y="166" width="180" height="180" rx="24" fill="none" stroke="#d7e1ed" opacity="0.8"/>

  <text x="256" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="92" font-weight="700" fill="#16304f">AI</text>
</svg>
